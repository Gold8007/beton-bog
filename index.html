<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --bg:#eceeec; --surface:#ffffff; --surface2:#f4f5f3; --ink:#1c2226; --muted:#5b6569; --line:#d6dad7;
  --side:#22292c; --side-ink:#dfe4e2; --side-muted:#8e999c; --side-hi:#323b3f;
  --accent:#2d6a4f; --accent-ink:#ffffff;
  --good:#2f7d4f; --bad:#b23b3b; --warn:#9a6a12; --bad-soft:#f7e3e3; --warn-soft:#f6ecd6; --good-soft:#e1efe6;
  --c-steel:#3d5f7a; --c-ochre:#b07d2b; --c-leaf:#3c8a5a; --c-plum:#7a4f7a; --c-clay:#9a5a3c;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:8px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#131718; --surface:#1b2022; --surface2:#21272a; --ink:#e5e9e7; --muted:#9aa4a7; --line:#2f373a;
  --side:#0e1112; --side-ink:#dfe4e2; --side-muted:#7f8a8d; --side-hi:#1f2629;
  --accent:#62b38d; --accent-ink:#0d1a13;
  --good:#62b38d; --bad:#e58080; --warn:#dcaa4d; --bad-soft:#3a2224; --warn-soft:#3a3020; --good-soft:#1d3329;
  --c-steel:#7ea6c6; --c-ochre:#d9a650; --c-leaf:#6fbf8c; --c-plum:#c08fc0; --c-clay:#d18d6c;
  color-scheme:dark}}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-ink);padding:20px 16px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.logo{font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1.15;margin:0}
.logo small{display:block;font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--side-muted);margin-top:4px}
nav{display:flex;flex-direction:column;gap:2px;margin-top:18px}
.ngroup{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--side-muted);margin:14px 10px 4px}
nav a{display:block;padding:7px 10px;border-radius:6px;color:var(--side-ink);text-decoration:none}
nav a:hover{background:var(--side-hi)}
nav a.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.me{margin-top:auto;padding-top:16px;font-size:12px;color:var(--side-muted);display:flex;flex-direction:column;gap:6px}
.me b{color:var(--side-ink);font-weight:500;word-break:break-all}
.me button{align-self:flex-start;background:transparent;border:1px solid var(--side-hi);color:var(--side-ink);border-radius:6px;padding:4px 10px;cursor:pointer}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--line);background:var(--surface)}
.top h1{font-family:var(--f-display);font-weight:500;font-size:19px;margin:0}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters select,.filters input{background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.lang button{border:0;background:transparent;padding:6px 10px;cursor:pointer}
.lang button.on{background:var(--ink);color:var(--bg)}
.content{padding:20px 24px 48px;display:flex;flex-direction:column;gap:20px;min-width:0}
.notice{padding:10px 14px;border-radius:var(--r);background:var(--warn-soft);font-size:13px}
.notice[data-kind="bad"]{background:var(--bad-soft)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpi .v{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:12px;color:var(--muted)}
.pos{color:var(--good)} .neg{color:var(--bad)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.ph{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.ph h2{font-size:15px;font-weight:600;margin:0}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap}
.pb{padding:14px 16px}
.grid2{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:20px}
.dirs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.dcard{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--dc,var(--muted));border-radius:var(--r);padding:14px 16px;cursor:pointer;text-align:left}
.dcard:hover{border-color:var(--dc)}
.dcard h3{margin:0 0 8px;font-size:15px}
.dl{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:13px;margin:0}
.dl dt{color:var(--muted)} .dl dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px;cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn:disabled{opacity:.6;cursor:default}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:600;color:var(--muted);font-size:12px;background:var(--surface2)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.tot td{font-weight:600;background:var(--surface2)}
tbody tr:hover td{background:var(--surface2)}
td.wrap{white-space:normal;min-width:160px}
td select{background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
.dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;background:var(--dc,var(--muted))}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:500}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:12px}
.chip b{font-variant-numeric:tabular-nums;margin-left:6px}
.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.li:last-child{border-bottom:0}
.li .m{color:var(--muted);font-size:12px}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-bottom:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.modal{position:fixed;inset:0;background:rgba(10,14,15,.5);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:50}
.dialog{background:var(--surface);border-radius:10px;width:100%;max-width:520px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.dialog h3{margin:0;padding:16px 20px;border-bottom:1px solid var(--line);font-size:16px}
.form{padding:16px 20px;display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label{font-size:12px;color:var(--muted);font-weight:500}
.fld input,.fld select,.fld textarea{background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
.fld textarea{min-height:60px;resize:vertical}
.fld .hint{font-size:12px;color:var(--muted)}
.fld .hint.warn{color:var(--warn)}
.dfoot{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;padding:14px 20px;border-top:1px solid var(--line)}
.dfoot .r{display:flex;gap:8px;margin-left:auto}
.err{grid-column:1/-1;color:var(--bad);font-size:13px}
.ok{grid-column:1/-1;color:var(--good);font-size:13px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13px;z-index:60;max-width:calc(100% - 32px)}
.muted{color:var(--muted)}
.help{font-size:13px;color:var(--muted);max-width:70ch;margin:0}
/* login */
.auth{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:var(--side)}
.acard{background:var(--surface);border-radius:12px;width:100%;max-width:400px;padding:28px 24px;display:flex;flex-direction:column;gap:16px}
.acard .logo{color:var(--ink)} .acard .logo small{color:var(--muted)}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:8px;cursor:pointer;color:var(--muted);font-weight:500}
.tabs button.on{color:var(--ink);border-color:var(--accent)}
.acard .form{padding:0;grid-template-columns:1fr}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;padding:12px 16px 8px}
  .logo small,.ngroup{display:none}
  nav{flex-direction:row;overflow-x:auto;margin-top:10px;gap:4px;padding-bottom:4px}
  nav a{white-space:nowrap;background:var(--side-hi)}
  .me{flex-direction:row;align-items:center;justify-content:space-between;padding-top:8px}
  .top,.content{padding-left:16px;padding-right:16px}
  .form{grid-template-columns:1fr}
  .kpi .v{font-size:18px}
}
</style>
</head>

    <div class="content">
      <div id="notice" class="notice" hidden></div>
      <div id="view"></div>
    </div>
  </div>
</div>

const grp=s=>s.replace(/\B(?=(\d{3})+(?!\d))/g," ");
function money(n){n=Math.round(+n||0);return (n<0?"−":"")+grp(String(Math.abs(n)));}
function qty(n){n=+n||0;const r=Math.round(n*100)/100;const [i,f]=String(Math.abs(r)).split(".");return (r<0?"−":"")+grp(i)+(f?","+f:"");}

function range(){
  const d=new Date(),y=d.getFullYear(),m=d.getMonth();
  switch(S.per){
    case "month":return{from:iso(new Date(y,m,1)),to:iso(new Date(y,m+1,0))};

    case "year":return{from:y+"-01-01",to:y+"-12-31"};
    case "custom":return{from:S.from||"1900-01-01",to:S.to||"2999-12-31"};

}

/* ---------- computations ---------- */
function avgPrice(mid){let q=0,v=0;D.moves.forEach(m=>{if(m.material===mid&&m.type==="in"){q+=m.qty;v+=m.qty*m.price;}});return q?v/q:0;}
function deprMonths(a,r){
  const life=+a.life||0;if(!life||!a.date)return 0;
  const start=mIdx(a.date)+1,end=start+Math.round(life*12)-1,now=mIdx(today());
  const lo=Math.max(start,r?mIdx(r.from):start),hi=Math.min(end,now,r?mIdx(r.to):now);
  return Math.max(0,hi-lo+1);
}
const monthly=a=>(+a.life?(+a.cost||0)/(+a.life*12):0);
function pnl(r){
  const z=()=>({sales:0,other:0,mat:0,exp:0,cats:{},dep:0});
  const m={"":z()};dirs().forEach(d=>m[d.id]=z());
  const g=k=>m[k||""]||(m[k]=z());
  D.sales.forEach(s=>{if(inR(r,s.date))g(s.dir).sales+=s.qty*s.price;});
  D.incomes.forEach(s=>{if(inR(r,s.date))g(s.dir).other+=s.amount;});
  D.moves.forEach(s=>{if(s.type==="out"&&inR(r,s.date))g(s.dir).mat+=s.qty*s.price;});
  D.expenses.forEach(s=>{if(inR(r,s.date)){const o=g(s.dir);o.exp+=s.amount;o.cats[s.cat]=(o.cats[s.cat]||0)+s.amount;}});
  D.assets.forEach(a=>{g(a.dir).dep+=monthly(a)*deprMonths(a,r);});
  Object.values(m).forEach(o=>{o.rev=o.sales+o.other;o.cost=o.mat+o.exp+o.dep;o.profit=o.rev-o.cost;});
  return m;
}
function summary(r){
  const m=pnl(r);const keys=S.dir==="all"?Object.keys(m):[S.dir];
  const o={rev:0,cost:0,profit:0};keys.forEach(k=>{const x=m[k];if(!x)return;o.rev+=x.rev;o.cost+=x.cost;o.profit+=x.profit;});
  return o;
}
const saleTotal=s=>s.qty*s.price;
const saleDebt=s=>Math.max(0,saleTotal(s)-(s.paid||0));
const prodBal=pid=>{let b=0;D.production.forEach(x=>{if(x.product===pid)b+=x.qty;});D.sales.forEach(x=>{if(x.product===pid)b-=x.qty;});return b;};
function stockRows(){
  return D.products.filter(dirOk).map(p=>{
    let pr=0,so=0;D.production.forEach(x=>{if(x.product===p.id)pr+=x.qty;});D.sales.forEach(x=>{if(x.product===p.id)so+=x.qty;});
    return{p,pr,so,bal:pr-so,val:(pr-so)*(p.price||0)};
  }).sort((a,b)=>(a.p.dir||"").localeCompare(b.p.dir||"")||a.p.name.localeCompare(b.p.name));
}
function matRows(){
  return [...D.materials].sort((a,b)=>a.name.localeCompare(b.name)).map(mt=>{
    let i=0,o=0;D.moves.forEach(m=>{if(m.material===mt.id){if(m.type==="in")i+=m.qty;else o+=m.qty;}});
    const avg=avgPrice(mt.id),bal=i-o;return{mt,i,o,bal,avg,val:bal*avg,st:bal<=0?"out":(bal<(mt.min||0)?"low":"ok")};
  });
}

/* ---------- tables ---------- */
function table(spec){
  S.tables[spec.name]=spec;
  if(!spec.rows.length)return `<div class="empty"><b>${t("emptyT")}</b>${esc(spec.empty??t("emptyPeriod"))}</div>`;
  const ed=spec.edit&&canW(spec.edit);
  const hasTot=spec.cols.some(c=>c.tot);
  let h=`<div class="tw"><table><thead><tr>${spec.cols.map(c=>`<th class="${c.n||c.m?"n":""}">${esc(c.l)}</th>`).join("")}${ed?"<th></th>":""}</tr></thead><tbody>`;
  spec.rows.forEach(r=>{
    h+="<tr>"+spec.cols.map(c=>{const raw=c.v(r);const html=c.h?c.h(r):(c.m?money(raw):c.n?qty(raw):esc(raw));return `<td class="${c.n||c.m?"n":""}${c.wrap?" wrap":""}">${html}</td>`;}).join("");
    if(ed)h+=`<td class="n"><button class="btn sm" data-edit="${spec.edit}" data-id="${esc(spec.rowId?spec.rowId(r):r.id)}">${t("edit")}</button></td>`;
    h+="</tr>";
  });
  if(hasTot){h+=`<tr class="tot">`+spec.cols.map((c,i)=>{if(c.tot){const s=spec.rows.reduce((a,r)=>a+(+c.v(r)||0),0);return `<td class="n">${c.m?money(s):qty(s)}</td>`;}return `<td>${i===0?t("total"):""}</td>`;}).join("")+(ed?"<td></td>":"")+"</tr>";}
  return h+"</tbody></table></div>";
}
function csv(spec){
  const q=v=>{v=String(v??"");return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const lines=[spec.cols.map(c=>q(c.l)).join(";")];
  spec.rows.forEach(r=>lines.push(spec.cols.map(c=>{const v=c.v(r);return q(c.n||c.m?String(Math.round((+v||0)*100)/100).replace(".",","):v);}).join(";")));
  return "﻿"+lines.join("\r\n");
}

function chart(){
  const now=new Date(),pts=[];
  for(let i=11;i>=0;i--){const a=new Date(now.getFullYear(),now.getMonth()-i,1),b=new Date(now.getFullYear(),now.getMonth()-i+1,0);const s=summary({from:iso(a),to:iso(b)});pts.push({l:MONTHS[a.getMonth()],rev:s.rev,cost:s.cost});}
  const max=Math.max(1,...pts.map(p=>Math.max(p.rev,p.cost)));
  const e=Math.pow(10,Math.floor(Math.log10(max))),f=max/e,nice=(f<=1?1:f<=2?2:f<=5?5:10)*e;
  const W=640,H=230,L0=62,B=24,T0=8,cw=(W-L0-8)/12,ph=H-B-T0;

  };
  $("modal").innerHTML=`<div class="dialog" role="dialog" aria-modal="true"><h3>${esc(t(spec.title))} · ${rec?t("edit"):t("add")}</h3><form class="form" id="fform" novalidate>${spec.fields.map(fh).join("")}<div class="err" id="ferr"></div></form>
    <div class="dfoot">${rec?`<button class="btn danger" id="fdel" type="button">${t("del")}</button>`:""}<div class="r"><button class="btn" id="fcancel" type="button">${t("cancel")}</button><button class="btn pri" id="fsave" type="button">${t("save")}</button></div></div></div>`;
  $("modal").hidden=false;dyn();
  const first=$("modal").querySelector("input,select,textarea");if(first)first.focus();
}
function readForm(){F.spec.fields.forEach(f=>{const el=$("f_"+f.k);if(el)F.d[f.k]=el.value;});return F.d;}
function dyn(){
  const d=readForm();
  F.spec.fields.forEach(f=>{
    if(f.show)$("w_"+f.k).hidden=!f.show(d);
    const h=$("h_"+f.k);let v=f.hint?f.hint(d,F.rec):"";let cls="";if(Array.isArray(v)){cls=v[1];v=v[0];}h.textContent=v||"";h.className="hint "+(cls||"");
  });
}
function closeForm(){$("modal").hidden=true;$("modal").innerHTML="";F=null;}
const errText=e=>{const m=(e&&(e.message||e.code))||String(e);return /row-level security|permission/i.test(m)?t("noRight"):m;};
async function saveForm(){
  const d={...readForm()};const miss=[];
  F.spec.fields.forEach(f=>{
    if(f.show&&!f.show(d))d[f.k]="";
    if(f.type==="number"){const v=pnum(d[f.k]);d[f.k]=isNaN(v)?0:v;if(f.req&&!(d[f.k]>0))miss.push(t(f.l));}
    else{d[f.k]=String(d[f.k]||"").trim();if(f.req&&!d[f.k])miss.push(t(f.l));}
  });
  if(miss.length){$("ferr").textContent=t("required")+" "+miss.join(", ");return;}
  if(F.spec.prep)F.spec.prep(d);
  const m=MAP[F.col],row=m.to(d);
  const btn=$("fsave");btn.disabled=true;
  try{
    let res;
    if(F.id)res=await S.sb.from(m.table).update(row).eq("id",F.id).select();
    else{if(F.col==="directions")row.id="d"+Date.now().toString(36);res=await S.sb.from(m.table).insert(row).select();}
    if(res.error)throw res.error;
    if(!res.data||!res.data.length)throw{message:t("noRight")};
    const col=F.col;closeForm();toast(t("saved"));await loadCols([col]);
  }catch(e){btn.disabled=false;$("ferr").textContent=t("writeErr")+" "+errText(e);}
}
async function delForm(){
  const b=$("fdel");if(!F.delArm){F.delArm=true;b.textContent=t("delSure");return;}
  b.disabled=true;
  try{
    const res=await S.sb.from(MAP[F.col].table).delete().eq("id",F.id).select();
    if(res.error)throw res.error;if(!res.data||!res.data.length)throw{message:t("noRight")};
    const col=F.col;closeForm();toast(t("deleted"));await loadCols([col]);
  }catch(e){b.disabled=false;$("ferr").textContent=t("writeErr")+" "+errText(e);}
}

/* ---------- data loading ---------- */
async function fetchAll(table){
  const out=[];const step=1000;
  for(let from=0;;from+=step){
    const {data,error}=await S.sb.from(table).select("*").range(from,from+step-1);
    if(error)throw error;out.push(...data);if(data.length<step)break;
  }
  return out;
}
async function loadCols(cols){
  await Promise.all(cols.map(async c=>{const rows=await fetchAll(MAP[c].table);D[c].length=0;rows.forEach(r=>D[c].push(MAP[c].from(r)));}));
  render();
}
async function loadProfiles(){
  const {data,error}=await S.sb.from("profiles").select("*");
  if(!error&&data){S.profiles=data;const me=data.find(p=>p.id===S.user.id);if(me){S.role=me.active?me.role:null;S.name=me.full_name;}}
}
async function loadAll(){
  note(t("loading"));
  try{await loadProfiles();await loadCols(COLS);note(S.role==="viewer"||!S.role?t("pending"):"");}
  catch(e){note(t("loadErr")+" "+errText(e),"bad");}
}

/* ---------- export ---------- */
function exportTable(name){
  const spec=S.tables[name];if(!spec)return;
  const blob=new Blob([csv(spec)],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name+"_"+today()+".csv";
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);toast(t("exported"));
}

/* ---------- chrome & render ---------- */
const NAV=[["g_main",["dashboard","reports"]],["g_ops",["production","sales","expenses","incomes"]],["g_res",["stock","warehouse","assets"]],["g_set",["catalog","users"]]];
function langBtns(){document.querySelectorAll(".lUz").forEach(b=>b.className="lUz"+(S.lang==="uz"?" on":""));document.querySelectorAll(".lRu").forEach(b=>b.className="lRu"+(S.lang==="ru"?" on":""));document.documentElement.lang=S.lang==="ru"?"ru":"uz";}
function chrome(){
  langBtns();
  $("logoSub").textContent=t("sub");
  const canUsers=S.role==="admin"||S.role==="manager";
  $("nav").innerHTML=NAV.map(([g,items])=>`<div class="ngroup">${t(g)}</div>`+items.filter(v=>v!=="users"||canUsers).map(v=>`<a href="#${v}" class="${S.view===v?"on":""}">${t(v)}</a>`).join("")).join("");
  $("vtitle").textContent=t(S.view);
  if(S.dir!=="all"&&D.directions.length&&!byId("directions",S.dir))S.dir="all";
  $("fDir").innerHTML=`<option value="all">${t("allDirs")}</option>`+dirs().map(d=>`<option value="${esc(d.id)}">${esc(dirName(d.id))}</option>`).join("");$("fDir").value=S.dir;
  $("fPer").innerHTML=["month","prev","quarter","year","all","custom"].map(p=>`<option value="${p}">${t("p_"+p)}</option>`).join("");$("fPer").value=S.per;
  $("fFrom").hidden=$("fTo").hidden=S.per!=="custom";
  $("meName").textContent=S.name||(S.user&&S.user.email)||"";$("meRole").textContent=S.role?t("r_"+S.role):"";
  $("logout").textContent=t("logout");$("refresh").title=t("refresh");
}
function render(){
  if(!S.user)return renderAuth();
  chrome();S.tables={};
  if(S.view==="users"&&!(S.role==="admin"||S.role==="manager"))S.view="dashboard";
  $("view").innerHTML=`<div style="display:flex;flex-direction:column;gap:20px">${(VIEWS[S.view]||VIEWS.dashboard)()}</div>`;
}
function note(msg,kind){const n=$("notice");if(!msg){n.hidden=true;return;}n.textContent=msg;n.dataset.kind=kind||"";n.hidden=false;}
let tt;function toast(m){const e=$("toast");e.textContent=m;e.hidden=false;clearTimeout(tt);tt=setTimeout(()=>e.hidden=true,2600);}
function route(){const h=location.hash.slice(1);S.view=VIEWS[h]?h:"dashboard";render();window.scrollTo(0,0);}

/* ---------- auth ---------- */
function renderAuth(){
  $("appView").hidden=true;$("authView").hidden=false;langBtns();
  const up=S.authMode==="up";
  $("aSub").textContent=t("sub");$("tIn").textContent=t("signIn");$("tUp").textContent=t("signUp");
  $("tIn").className=up?"":"on";$("tUp").className=up?"on":"";
  $("aNameW").hidden=!up;$("aNameL").textContent=t("fullName");$("aPassL").textContent=t("password");
  $("aBtn").textContent=up?t("signUp"):t("signIn");
  $("aPass").autocomplete=up?"new-password":"current-password";
}
async function authSubmit(e){
  e.preventDefault();$("aErr").textContent="";$("aOk").textContent="";
  const email=$("aEmail").value.trim(),pass=$("aPass").value,name=$("aName").value.trim();
  if(!email||!pass){$("aErr").textContent=t("needEmail");return;}
  if(pass.length<6){$("aErr").textContent=t("passShort");return;}
  $("aBtn").disabled=true;
  try{
    if(S.authMode==="up"){
      const {data,error}=await S.sb.auth.signUp({email,password:pass,options:{data:{full_name:name||email},emailRedirectTo:location.href.split("#")[0]}});
      if(error)throw error;
      if(data.session)await onSession(data.session);else{$("aOk").textContent=t("signedUp");S.authMode="in";renderAuth();$("aOk").textContent=t("signedUp");}
    }else{
      const {data,error}=await S.sb.auth.signInWithPassword({email,password:pass});
      if(error)throw{message:t("badLogin")};
      await onSession(data.session);
    }
  }catch(err){$("aErr").textContent=err.message||String(err);}
  $("aBtn").disabled=false;
}
async function onSession(session){
  if(!session){S.user=null;S.role=null;renderAuth();return;}
  if(S.user&&S.user.id===session.user.id)return;
  S.user=session.user;$("authView").hidden=true;$("appView").hidden=false;
  route();await loadAll();
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const a=e.target.closest("[data-add]");if(a){openForm(a.dataset.add,null,a.dataset.preset?JSON.parse(a.dataset.preset):null);return;}
  const ed=e.target.closest("[data-edit]");if(ed){openForm(ed.dataset.edit,ed.dataset.id);return;}
  const x=e.target.closest("[data-export]");if(x){exportTable(x.dataset.export);return;}
  const sd=e.target.closest("[data-setdir]");if(sd){S.dir=sd.dataset.setdir;store("bb.dir",S.dir);render();return;}
  if(e.target.closest(".lUz")){S.lang="uz";store("bb.lang","uz");render();return;}
  if(e.target.closest(".lRu")){S.lang="ru";store("bb.lang","ru");render();return;}
  if(e.target.id==="fcancel"||e.target.id==="modal")closeForm();
  if(e.target.id==="fsave")saveForm();
  if(e.target.id==="fdel")delForm();
});
document.addEventListener("change",async e=>{
  const r=e.target.dataset&&(e.target.dataset.prole||e.target.dataset.pact);if(!r)return;
  const patch=e.target.dataset.prole?{role:e.target.value}:{active:e.target.value==="1"};
  const res=await S.sb.from("profiles").update(patch).eq("id",r).select();
  if(res.error||!res.data||!res.data.length){toast(t("writeErr")+" "+errText(res.error||{}));}else toast(t("saved"));
  await loadProfiles();render();
});
$("modal").addEventListener("input",()=>{if(F)dyn();});
$("modal").addEventListener("change",e=>{if(!F)return;const f=F.spec.fields.find(f=>"f_"+f.k===e.target.id);
  if(f&&f.change)f.change(readForm(),(kk,v)=>{const el=$("f_"+kk);if(el)el.value=v;});dyn();});
$("modal").addEventListener("keydown",e=>{if(e.key==="Escape")closeForm();if(e.key==="Enter"&&e.target.tagName==="INPUT"){e.preventDefault();saveForm();}});
$("fDir").onchange=e=>{S.dir=e.target.value;store("bb.dir",S.dir);render();};
$("fPer").onchange=e=>{S.per=e.target.value;store("bb.per",S.per);render();};
$("fFrom").onchange=e=>{S.from=e.target.value;render();};$("fTo").onchange=e=>{S.to=e.target.value;render();};
$("refresh").onclick=()=>loadAll();
$("logout").onclick=async()=>{await S.sb.auth.signOut();S.user=null;S.role=null;COLS.forEach(c=>D[c].length=0);renderAuth();};
$("tIn").onclick=()=>{S.authMode="in";renderAuth();};$("tUp").onclick=()=>{S.authMode="up";renderAuth();};
$("aForm").addEventListener("submit",authSubmit);
window.addEventListener("hashchange",route);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&S.user&&!F)loadAll();});

/* ---------- boot ---------- */
if(!window.supabase){document.body.innerHTML='<p style="padding:24px;font-family:sans-serif">Supabase кутубхонаси юкланмади. Интернет алоқасини текширинг.</p>';return;}
S.sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
S.sb.auth.getSession().then(({data})=>onSession(data.session));
S.sb.auth.onAuthStateChange((ev,session)=>{setTimeout(()=>{if(ev==="SIGNED_OUT"){S.user=null;renderAuth();}else if(session&&(!S.user||S.user.id!==session.user.id))onSession(session);},0);});
})();
</script>
</body>
</html>
